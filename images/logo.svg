  <!-- Stylized S Curve through the center -->
  <path d="M 180,100 c -60,0 -80,50 -10,100 c 70,50 50,100 -10,100 c -20,0 -30,-10 -30,-20" fill="none" stroke="#D31224" stroke-width="30" stroke-linecap="round" />
  <path d="M 230,300 c 60,0 80,-50 10,-100 c -70,-50 -50,-100 10,-100 c 20,0 30,10 30,20" fill="none" stroke="#D31224" stroke-width="30" stroke-linecap="round" />

